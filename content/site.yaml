about:
  kicker: About
  heading: A magazine for people trying to leave early.
  paragraphs:
    - Early Exit is a software engineer in New York documenting one attempt. Retire in his thirties, or admit the 9-to-5 was the whole story.
    - The channel is @earlyexitplan. Fifty-seven thousand subscribers, forty-nine videos, 3.9 million views. This site is not that channel. It is a desk copy of the public catalog, arranged as issues so the through-line is louder than the upload date.
    - Nothing here is a course. The cover is the plan. The featured film is the paycheck. The lead essay is the politics of staying poor. Around them sit the craft, the ledger, and the arguments.
    - Videos stay on YouTube. Press play on a piece and it loads then, not before.
