- id: script-process
  department: craft
  role: story
  kicker: The method
  heading: How I script every YouTube video
  dek: He does not type scripts. He talks them into a document, then cuts the transcript until
    it is a film — twenty minutes, start to finish.
  video: https://www.youtube.com/watch?v=AALFi1mZb1o
  poster: /images/thumbs/AALFi1mZb1o.webp
  posterWidth: 960
  posterHeight: 540
  duration: 1238
  views: 46492
  published: '2026-08-22'
  pullQuote: If you write a script by typing, you are writing in the wrong language.
  paragraphs:
  - Spoken language and written language are not cousins. They are different species. This
    process treats the camera as a conversation that has been edited, not an essay that has
    been performed.
  - 'Storyboard. Brain dump out loud. Overshoot on purpose. Three refining passes. The heresy
    at the end: he does not worship hooks. For a magazine of clips, that is the point — the
    middle has to be worth staying for.'
