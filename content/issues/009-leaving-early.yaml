  pullQuote: You do not find a new life in the same room.
  paragraphs:
  - 'Geographic arbitrage usually arrives as a spreadsheet. This clip arrives as a feeling:
    the version of you that only exists after you have unpacked in a city that does not know
    your high school.'
  - New York is both the pressure cooker and the proof. The later plan — a cheaper country,
    a smaller burn — is the same idea with a passport.
