sections:
- id: editors-letter
  kicker: Editor's letter
  heading: A magazine for people trying to leave early.
  paragraphs:
  - 'Early Exit is a software engineer in New York documenting the attempt: retire in his
    thirties, or admit the 9-to-5 was the whole story. Forty-nine videos. Fifty-seven thousand
    people watching. This issue treats that catalog the way a magazine treats a reporter''s
    year — as clips you can play, and as arguments you can sit with.'
  - 'The cover is the plan. The featured film is the paycheck. The lead essay is the politics
    of staying poor. Around them: how to script without typing, how a down month still gets
    published, why a large channel might be a trap. Nothing here is a course. It is a desk
    copy of work that already exists on YouTube, arranged so the through-line is louder than
    the upload date.'
- id: sacrificing-20s
  department: exit
  role: cover
  kicker: The full plan
  heading: Why I'm sacrificing my 20s to retire in my 30s
  dek: A software engineer in New York compresses a forty-year career into a decade — and
    writes down the number, the city, and the trade.
  video: https://www.youtube.com/watch?v=se4SHHTThk0
  poster: /images/thumbs/se4SHHTThk0.webp
  posterWidth: 960
  posterHeight: 540
  duration: 945
  views: 220000
  published: '2026-03-01'
  pullQuote: The plan is not a mood. It is a date, a city, and a monthly number that has to
    clear.
  paragraphs:
  - Most people treat early retirement as a screensaver — a picture of a beach they will never
    book. This clip is the opposite. He puts a number on the table, a decade on the clock,
    and a life he is willing to make smaller now so it can get larger later.
  - 'The sacrifice is specific: evenings, weekends, the social calendar that New York sells
    as a personality. In return, a path out of the building before the building owns the rest
    of the thirties. The magazine opens here because every other clip in this issue is a tool
    for that exit — the channel, the ledger, the politics of staying poor.'
  - 'Watch it as a blueprint, not a sermon. The interesting part is not the hustle. It is
    the willingness to say the quiet part: this job is a vehicle, not a home.'
- id: youtube-pays
  department: craft
  role: featured
  kicker: The real numbers
  heading: How much YouTube pays at 1K, 10K, and 50K
  dek: Zero at one thousand. Zero at five. Zero at ten. The first dollar arrives late — and
    two mistakes cost about four thousand of them.
  video: https://www.youtube.com/watch?v=Fv4s8CAMvIo
  poster: /images/thumbs/Fv4s8CAMvIo.webp
  posterWidth: 960
  posterHeight: 540
  duration: 1066
  views: 216604
  published: '2026-08-29'
  pullQuote: At 50,000 subscribers the channel had earned just under $8,000 — cumulative,
    from August to July.
  paragraphs:
  - 'Creators talk about subscriber counts the way cities talk about skylines — as if height
    were income. This video is a teardown of that lie, using the only ledger that matters:
    what YouTube actually wired.'
  - Monetization was denied long enough to leave about $4,000 on the table. YouTube then filed
    the channel in a category that paid worse. Two videos made half of all revenue. The rest
    of the catalog, including work he is proud of, paid like a hobby.
  - The useful ending is not a CPM chart. It is the decision to stop chasing the viral lottery
    and build something that does not need a thumbnail to survive.
