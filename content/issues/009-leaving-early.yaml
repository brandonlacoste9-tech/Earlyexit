- id: gen-z-politics
  department: essays
  role: lead
  kicker: The long essay
  heading: How Gen Z will change politics forever
  dek: Housing, wages, layoffs, a broken promise. Then seven policies — and a personal plan
    that does not wait for any of them.
  video: https://www.youtube.com/watch?v=ZMQALttUvyM
  poster: /images/thumbs/ZMQALttUvyM.webp
  posterWidth: 960
  posterHeight: 540
  duration: 3477
  views: 945000
  published: '2025-11-10'
  pullQuote: The average first-time buyer is 40. Wages have been flat for fifty years while
    productivity rose 77%.
  paragraphs:
  - 'This is the clip that left the channel and entered the culture: a nearly hour-long argument
    that Gen Z was sold a ladder with the rungs removed. Housing, wages, a hostile job market,
    record layoffs beside record profits. It is the most-watched film in the catalog for a
    reason — it names the weather everyone is standing in.'
  - The second half is rarer. He does not stop at diagnosis. Housing reform, wages tied to
    productivity, corporate accountability, healthcare, political reform, education, worker
    protections — then a section on what a single person can actually do before any of that
    arrives.
  - The last minutes return to the magazine's thesis. Waiting for the country to become fair
    is not a retirement plan. The personal exit — income you own, a cheaper city, a number
    you can live on — is the part of politics you can pass without a majority.
