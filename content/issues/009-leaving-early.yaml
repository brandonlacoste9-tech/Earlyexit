- id: system-keeps-poor
  department: essays
  role: story
  kicker: The poverty tax
  heading: The system is designed to keep Gen Z poor
  dek: Commute, car, food, housing, overdrafts, medical debt — a day in two ledgers, one of
    them punished at every door.
  video: https://www.youtube.com/watch?v=UFzH7FsbzXM
  poster: /images/thumbs/UFzH7FsbzXM.webp
  posterWidth: 960
  posterHeight: 540
  duration: 1488
  views: 207000
  published: '2025-12-24'
  pullQuote: Being poor is expensive. Being rich just makes you richer. That is not a conspiracy.
    It is a receipt.
  paragraphs:
  - 'If the politics film is the wide shot, this is the close-up. He walks a poor day against
    a rich day and lets the fees stack: time on the train, the car that breaks, the grocery
    store that charges more for worse food, the bank that harvests overdrafts, the medical
    bill that becomes a second job.'
  - The second half is unglamorous on purpose — no-fee banks, a better used car, meal prep,
    negotiating a bill. Survival is not the exit. It is the breathing room the exit requires.
